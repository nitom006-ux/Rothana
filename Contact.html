<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETEC | Contact</title>
    <link rel="icon" href="LOGO.png" type="image/x-icon">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: rgb(86, 88, 95);
            color: #111;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            padding: 20px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            max-width: 1200px;
            margin: 15px auto;
        }

        .logo {
            width: 100px;
            height: 100px;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .nav-brand {
            font-family: 'Forte', cursive;
            font-size: 50px;
            font-weight: 700;
            color: #333;
            margin-left: -303px;
            align-self: center;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        .nav-right {
            display: flex;
            gap: 16px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-right a {
            text-decoration: none;
            color: #333;
            font-weight: 600;
            font-size: 13px;
        }

        .language-switch {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 12px;
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 999px;
            background: #f7f7f7;
        }

        .language-switch a {
            text-decoration: none;
            color: #333;
            font-weight: 700;
            font-size: 13px;
        }

        .language-switch .active {
            color: #ff5252;
        }

        .contact-container {
            max-width: 900px;
            margin: 30px auto 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
        }

        .contact-container h1 {
            margin-top: 0;
            font-family: 'Showcard Gothic', sans-serif;
            font-size: 32px;
            color: #111;
        }

        .contact-item {
            margin-bottom: 16px;
            font-size: 16px;
            color: #444;
        }

        .contact-item strong {
            color: #111;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="Body.html">
                <img src="LOGO.png" alt="Logo">
            </a>
        </div>
        <div class="nav-brand">Hev Style</div>
        <ul class="nav-right">
            <li><a href="Body.html">Home</a></li>
            <li><a href="Story.html">Our Story</a></li>
            <li><a href="Contact.html">Contact</a></li>
        </ul>
        <div class="language-switch">
            <a href="Body.html" class="active">ENG</a>
            <a href="Project-KH.html">KH</a>
        </div>
    </nav>

    <div class="contact-container">
        <h1>Contact Us</h1>
        <div class="contact-item"><strong>Email:</strong> hevfashion@gmail.com</div>
        <div class="contact-item"><strong>Phone:</strong> +855 999 888 77</div>
        <div class="contact-item"><strong>Address:</strong> Phnom Penh, Cambodia</div>
        <div class="contact-item"><strong>Working Hours:</strong> Monday - Sunday, 9:00 AM - 8:00 PM</div>
    </div>
</body>
</html>
